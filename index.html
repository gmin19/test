<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>이온몰 라이카무 모바일 쇼핑 지도</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        
        <main id="map-view" class="map-view">
            <div id="zoom-wrapper" class="zoom-wrapper">
                <img id="current-floor-map" src="assets/maps/map-1f.svg" alt="이온몰 라이카무 1층 지도">
                
                <div id="poi-layer" class="poi-layer hidden"></div>
            </div>
        </main>

        <nav class="floor-selector">
            <button class="floor-btn" data-floor="5">5F</button>
            <button class="floor-btn" data-floor="4">4F</button>
            <button class="floor-btn" data-floor="3">3F</button>
            <button class="floor-btn" data-floor="2">2F</button>
            <button class="floor-btn active" data-floor="1">1F</button>
        </nav>

        <div class="floating-controls">
            <button id="toggle-amenities" class="fab-btn">편의시설 보기</button>
        </div>

        <section id="bottom-sheet" class="bottom-sheet hidden">
            <div class="sheet-handle"></div>
            <div class="sheet-content">
                <h2 id="store-name">매장 이름</h2>
                <p id="store-category" class="category">카테고리</p>
                <p id="store-time" class="time">영업시간</p>
                <p id="store-desc" class="desc">매장에 대한 간략한 설명이 들어갈 자리입니다.</p>
                <button id="close-sheet" class="close-btn">닫기</button>
            </div>
        </section>

    </div>

    <script src="js/panzoom.min.js"></script>
    <script src="js/map-controller.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
